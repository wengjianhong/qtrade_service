// @file      config.proto
// @brief     配置中心 gRPC 接口定义
// @details   控制面：引擎出站 GetEngineConfig / SubscribeEngineConfig；下发策略、行情源和适配器选择，不含账户凭证
// @author    wengjianhong
// @date      2026-06-28
// @copyright CC BY-NC-SA 4.0
syntax = "proto3";

package qtrade.config.v1;

import "common/v1/meta.proto";

option cc_enable_arenas = true;

// 策略配置
message StrategyConfig {
    // 策略实例标识
    string strategy_id = 1;
    // 策略插件名
    string strategy_name = 2;
    // 是否启用
    bool enabled = 3;
    // 订阅合约列表
    repeated string instruments = 4;
    // 单笔下单量
    int64 order_volume = 5;
    // 最大持仓（绝对值）
    int64 max_position_volume = 6;
    // 发单冷却（毫秒）
    int32 order_cooldown_ms = 7;

    // ========== 可选参数 ==========
    // 策略计算窗口(K线/Tick样本数量)
    optional int32 window_size = 8;
    // 下单信号阈值（信号强度大于此值时才发单）
    optional double order_threshold = 9;
    // 止损比例（持仓亏损超过此比例时止损）
    optional double stop_loss_percent = 10;
    // 止盈比例（持仓盈利超过此比例时止盈）
    optional double take_profit_percent = 11;
}

// 引擎实例共享风控配置。账户硬限制由 account-risk-service 独立裁决。
message InstanceRiskConfig {
    // 配置中心单调递增版本，用于拒绝旧配置和断线续传
    uint64 version = 1;
    // 单笔最大数量；0 表示不限制
    int64 max_order_volume = 2;
    // 单笔最大名义金额；0 表示不限制
    double max_order_notional = 3;
    // 最大活动订单数；0 表示不限制
    uint64 max_open_orders = 4;
    // 最大待成交订单名义金额；0 表示不限制
    double max_pending_notional = 5;
}

// 引擎实例配置（按 engine_id 分片）
message EngineConfig {
    // 引擎实例标识
    string engine_id = 1;
    // 租户标识；必须与引导配置一致
    string tenant_id = 2;
    // 引擎使用的交易账户引用，不含凭证
    string account_id = 3;
    // 主行情源
    string quote_source = 4;
    // 备用行情源；空表示不启用自动切换
    string quote_failover = 5;
    // 配置失效时间（Unix 毫秒）；0 表示由服务端默认 TTL 决定
    int64 valid_until_unix_ms = 6;
    // 交易适配器类型：mock 或 emt；由控制面和界面维护
    string execution_adapter = 7;
    // 主行情源连接串；例如 mock://localhost 或厂商连接地址
    string quote_connection_string = 8;
    // 配置中心单调递增版本，用于拒绝旧配置和断线续传
    uint64 version = 9;
    // 最后一笔有效 Tick 允许的最大静默时间（毫秒）；0 表示使用引擎默认值
    int32 quote_max_stale_ms = 10;
    // 策略绑定列表
    repeated StrategyConfig strategies = 11;
    // 实例级共享风控配置
    InstanceRiskConfig instance_risk = 12;
}

// 获取引擎配置请求
message GetEngineConfigRequest {
    // 统一请求链路元数据
    qtrade.common.meta.v1.RequestMeta meta = 1;
    // 引擎实例标识
    string engine_id = 2;
}

// 获取引擎配置响应
message GetEngineConfigResponse {
    // 统一响应链路元数据
    qtrade.common.meta.v1.ResponseMeta meta = 1;
    // 当前引擎配置
    EngineConfig engine = 2;
}

// 订阅引擎配置请求
message SubscribeEngineConfigRequest {
    // 统一请求链路元数据
    qtrade.common.meta.v1.RequestMeta meta = 1;
    // 引擎实例标识
    string engine_id = 2;
    // 客户端已接收的最新版本（0 表示获取最新配置）
    uint64 since_version = 3;
}

// 订阅引擎配置响应
message SubscribeEngineConfigResponse {
    // 统一响应链路元数据
    qtrade.common.meta.v1.ResponseMeta meta = 1;
    // 本次推送的引擎配置
    EngineConfig engine = 2;
}

// 配置中心 gRPC 服务
service ConfigService {
    // 获取引擎配置
    rpc GetEngineConfig(GetEngineConfigRequest) returns (GetEngineConfigResponse);
    // 订阅引擎配置变更（Server Streaming）
    rpc SubscribeEngineConfig(SubscribeEngineConfigRequest) returns (stream SubscribeEngineConfigResponse);
}
